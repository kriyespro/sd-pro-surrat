# SuratPro production — exposed on host port 8787 (docker-compose: 8787:80)
# 62.72.43.194 / suratpro.com — isolated Docker project "suratpro"
# SSL: mount certs to /etc/nginx/certs/ and uncomment ssl_* lines below.

upstream suratpro_web {
    server web:8000;
    keepalive 32;
}

# Redirect HTTP -> HTTPS (enable when SSL certs are mounted)
# server {
#     listen 80;
#     server_name 62.72.43.194 suratpro.com www.suratpro.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name 62.72.43.194 suratpro.com www.suratpro.com;

    # Docker embedded DNS — resolves upstream hostnames at request time
    resolver 127.0.0.11 valid=10s ipv6=off;

    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/xml+rss image/svg+xml;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
