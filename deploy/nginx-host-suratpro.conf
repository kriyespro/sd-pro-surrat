# Host Nginx — SSL for suratpro.com → Docker on 127.0.0.1:8787
# Install: see deploy/SSL_INSTALL.md
#
#   sudo cp deploy/nginx-host-suratpro.conf /etc/nginx/sites-available/suratpro
#   sudo ln -sf /etc/nginx/sites-available/suratpro /etc/nginx/sites-enabled/suratpro
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP: Let's Encrypt challenge + redirect to HTTPS ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name suratpro.com www.suratpro.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: terminate SSL here, proxy to SuratPro Docker (port 8787) ───────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name suratpro.com www.suratpro.com;

    ssl_certificate /etc/letsencrypt/live/suratpro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suratpro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
