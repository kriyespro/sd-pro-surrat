<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — SuratPro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
:root{--gold:#E8A830;--gold-light:#F5C96A;--gold-dim:rgba(232,168,48,0.12);--teal:#0D6E6E;--dark:#080F0F;--dark2:#0D1A1A;--mid:#142323;--white:#fff;--text-muted:#7AABAB;--text-dim:#4A7A7A;--border:rgba(255,255,255,0.07);--border-gold:rgba(232,168,48,0.25);--green:#3ECA8F;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);height:100vh;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--teal);border-radius:4px}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 5%;height:64px;background:rgba(8,15,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-gold);flex-shrink:0}
.logo{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900}.logo span{color:var(--gold)}
.chat-wrap{display:flex;flex:1;min-height:0}
/* Thread list */
.thread-list{width:300px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--dark2)}
.thread-search{padding:0.8rem;border-bottom:1px solid var(--border)}
.thread-search input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:0.55rem 0.8rem;color:var(--white);font-family:'DM Sans',sans-serif;font-size:0.85rem;outline:none}
.thread-search input:focus{border-color:var(--gold)}
.thread-search input::placeholder{color:var(--text-dim)}
.thread-item{display:flex;align-items:center;gap:0.75rem;padding:0.9rem 1rem;cursor:pointer;transition:background 0.15s;border-bottom:1px solid rgba(255,255,255,0.04)}
.thread-item:hover,.thread-item.active{background:rgba(255,255,255,0.04)}
.thread-item.active{background:var(--gold-dim);border-right:3px solid var(--gold)}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:0.9rem;font-weight:700;color:var(--dark);flex-shrink:0}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0}
/* Chat window */
.chat-window{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{padding:0.9rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.9rem;background:rgba(8,15,15,0.6);flex-shrink:0}
.chat-messages{flex:1;overflow-y:auto;padding:1.2rem 1.5rem;display:flex;flex-direction:column;gap:1rem}
.msg{display:flex;gap:0.7rem;max-width:70%}
.msg.mine{flex-direction:row-reverse;margin-left:auto}
.bubble{padding:0.75rem 1rem;border-radius:14px;font-size:0.88rem;line-height:1.55}
.bubble.theirs{background:var(--mid);border-radius:14px 14px 14px 4px}
.bubble.mine{background:var(--teal);border-radius:14px 14px 4px 14px}
.msg-time{font-size:0.65rem;color:var(--text-dim);align-self:flex-end;white-space:nowrap}
.chat-input-bar{padding:0.9rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:0.7rem;align-items:flex-end;background:var(--dark2);flex-shrink:0}
.chat-input{flex:1;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.1);border-radius:12px;padding:0.75rem 1rem;color:var(--white);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;resize:none;min-height:44px;max-height:120px;transition:border-color 0.2s}
.chat-input:focus{border-color:var(--gold)}
.chat-input::placeholder{color:var(--text-dim)}
.send-btn{padding:0.72rem 1.2rem;background:var(--gold);color:var(--dark);border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:0.9rem;transition:all 0.2s;flex-shrink:0}
.send-btn:hover{background:var(--gold-light);transform:translateY(-1px)}
.icon-btn{width:38px;height:38px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;font-size:1rem;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2)}
/* Info panel */
.info-panel{width:240px;flex-shrink:0;border-left:1px solid var(--border);background:var(--dark2);padding:1.2rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto}
</style>
</head>
<body x-data="messagesApp()">
<nav>
  <a href="index.html" class="logo">Surat<span>Pro</span></a>
  <div style="display:flex;gap:0.7rem;align-items:center">
    <a href="dashboard.html" style="font-size:0.85rem;color:var(--text-muted);text-decoration:none">← Dashboard</a>
    <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0D6E6E,#E8A830);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;color:var(--dark)">SM</div>
  </div>
</nav>

<div class="chat-wrap">
  <!-- Thread List -->
  <div class="thread-list">
    <div class="thread-search">
      <input type="text" placeholder="Search conversations…" x-model="search">
    </div>
    <div style="overflow-y:auto;flex:1">
      <template x-for="t in threads.filter(t=>t.name.toLowerCase().includes(search.toLowerCase()))" :key="t.id">
        <div class="thread-item" :class="{active:activeThread===t.id}" @click="activeThread=t.id;t.unread=false">
          <div class="avatar" :style="'background:'+t.color" x-text="t.initials"></div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.2rem">
              <span style="font-size:0.88rem;font-weight:600" x-text="t.name"></span>
              <span style="font-size:0.65rem;color:var(--text-dim)" x-text="t.time"></span>
            </div>
            <div style="font-size:0.75rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" x-text="t.lastMsg"></div>
          </div>
          <div x-show="t.unread" class="unread-dot"></div>
        </div>
      </template>
    </div>
  </div>

  <!-- Chat Window -->
  <div class="chat-window">
    <template x-if="activeThread">
      <div style="display:flex;flex-direction:column;height:100%">
        <!-- Header -->
        <div class="chat-header">
          <div class="avatar" :style="'background:'+currentThread.color" x-text="currentThread.initials" style="width:42px;height:42px"></div>
          <div style="flex:1">
            <div style="font-weight:600;font-size:0.95rem" x-text="currentThread.name"></div>
            <div style="font-size:0.72rem;color:var(--green)">🟢 Online · <span x-text="currentThread.title"></span></div>
          </div>
          <div style="display:flex;gap:0.5rem">
            <div class="icon-btn" title="Video call">📹</div>
            <div class="icon-btn" title="View profile" @click="window.location.href='profile.html'">👤</div>
            <div class="icon-btn" title="More options">⋯</div>
          </div>
        </div>

        <!-- Messages -->
        <div class="chat-messages" x-ref="msgArea">
          <!-- Date divider -->
          <div style="text-align:center;font-size:0.7rem;color:var(--text-dim);margin:0.5rem 0">
            <span style="background:rgba(255,255,255,0.05);padding:0.25rem 0.8rem;border-radius:100px">Today</span>
          </div>
          <template x-for="(m,i) in currentMessages" :key="i">
            <div class="msg" :class="{mine:m.mine}">
              <div x-show="!m.mine" class="avatar" :style="'background:'+currentThread.color+';width:32px;height:32px;font-size:0.72rem'" x-text="currentThread.initials"></div>
              <div>
                <div class="bubble" :class="m.mine?'mine':'theirs'" x-text="m.text"></div>
                <div class="msg-time" :style="m.mine?'text-align:right':''" x-text="m.time"></div>
              </div>
            </div>
          </template>
          <!-- Typing indicator -->
          <div x-show="typing" class="msg" style="max-width:120px">
            <div class="avatar" :style="'background:'+currentThread.color+';width:32px;height:32px;font-size:0.72rem'" x-text="currentThread.initials"></div>
            <div class="bubble theirs" style="padding:0.7rem 1rem">
              <span style="display:inline-flex;gap:3px">
                <span style="width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation:bounce 1s 0s infinite">.</span>
                <span style="width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation:bounce 1s 0.2s infinite">.</span>
                <span style="width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation:bounce 1s 0.4s infinite">.</span>
              </span>
            </div>
          </div>
        </div>

        <!-- Input -->
        <div class="chat-input-bar">
          <div class="icon-btn" title="Attach file">📎</div>
          <textarea class="chat-input" placeholder="Type a message…" x-model="newMsg" @keydown.enter.prevent="sendMessage()" rows="1"></textarea>
          <button class="send-btn" @click="sendMessage()">Send ↗</button>
        </div>
      </div>
    </template>

    <!-- Empty state -->
    <div x-show="!activeThread" style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;color:var(--text-muted)">
      <div style="font-size:3rem">💬</div>
      <div style="font-size:0.95rem">Select a conversation to start chatting</div>
    </div>
  </div>

  <!-- Info Panel -->
  <div class="info-panel" x-show="activeThread">
    <template x-if="activeThread">
      <div>
        <div style="text-align:center;margin-bottom:1rem">
          <div class="avatar" :style="'background:'+currentThread.color+';width:64px;height:64px;font-size:1.3rem;margin:0 auto 0.7rem'" x-text="currentThread.initials"></div>
          <div style="font-weight:600;font-size:0.95rem" x-text="currentThread.name"></div>
          <div style="font-size:0.75rem;color:var(--text-muted)" x-text="currentThread.title"></div>
        </div>
        <a href="profile.html" style="display:block;text-align:center;padding:0.6rem;background:var(--gold-dim);border:1px solid var(--border-gold);color:var(--gold);border-radius:8px;font-size:0.82rem;font-weight:600;text-decoration:none;margin-bottom:1rem">View Profile →</a>
        <div style="background:var(--mid);border:1px solid var(--border);border-radius:10px;padding:0.9rem">
          <p style="font-size:0.65rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:0.7rem;font-family:'Space Mono',monospace">// Contract Info</p>
          <div style="display:flex;flex-direction:column;gap:0.45rem;font-size:0.8rem;color:var(--text-muted)">
            <div>Status: <strong style="color:var(--green)">Active</strong></div>
            <div>Budget: <strong style="color:var(--white)">₹45,000</strong></div>
            <div>Deadline: <strong style="color:var(--white)">May 15, 2026</strong></div>
            <div>In Escrow: <strong style="color:var(--gold)">₹15,000</strong></div>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>

<style>
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
</style>
<script>
function messagesApp() {
  return {
    search: '', activeThread: 1, newMsg: '', typing: false,
    threads: [
      {id:1,name:'Karan Patel',initials:'KP',color:'linear-gradient(135deg,#0D6E6E,#E8A830)',title:'Full-Stack Developer',lastMsg:'I can start Monday. Should we schedule a call?',time:'2m ago',unread:true},
      {id:2,name:'Nidhi Shah',initials:'NS',color:'linear-gradient(135deg,#E85D04,#E8A830)',title:'Brand Designer',lastMsg:'Logo concepts are ready for review!',time:'1hr ago',unread:true},
      {id:3,name:'Dev Mehta',initials:'DM',color:'linear-gradient(135deg,#1A9090,#3ECA8F)',title:'Digital Marketing',lastMsg:'The campaign report is attached.',time:'Yesterday',unread:false},
      {id:4,name:'Vijay Parmar',initials:'VP',color:'linear-gradient(135deg,#3ECA8F,#0D6E6E)',title:'CA & Tax Consultant',lastMsg:'All GST filings are done for FY2025.',time:'2 days ago',unread:false},
    ],
    messages: {
      1: [
        {mine:false,text:'Hello! I saw your job posting for the SaaS dashboard. I have extensive experience with React and Django.',time:'10:02 AM'},
        {mine:true,text:'Great! Can you share some similar projects you\'ve worked on?',time:'10:05 AM'},
        {mine:false,text:'Sure! I built a similar inventory management system for a Surat textile firm last month. I\'ll share the portfolio link.',time:'10:07 AM'},
        {mine:true,text:'That sounds perfect. What\'s your availability?',time:'10:10 AM'},
        {mine:false,text:'I can start Monday. Should we schedule a call?',time:'10:12 AM'},
      ],
      2: [
        {mine:false,text:'Hi! I\'ve started working on the brand identity concepts.',time:'Yesterday 2:30 PM'},
        {mine:true,text:'Excited to see them! When will they be ready?',time:'Yesterday 2:45 PM'},
        {mine:false,text:'Logo concepts are ready for review!',time:'1hr ago'},
      ],
      3: [{mine:false,text:'The campaign report is attached.',time:'Yesterday 5:00 PM'}],
      4: [{mine:false,text:'All GST filings are done for FY2025.',time:'2 days ago'}],
    },
    get currentThread() { return this.threads.find(t=>t.id===this.activeThread) || null; },
    get currentMessages() { return this.messages[this.activeThread] || []; },
    sendMessage() {
      if(!this.newMsg.trim()) return;
      if(!this.messages[this.activeThread]) this.messages[this.activeThread]=[];
      this.messages[this.activeThread].push({mine:true,text:this.newMsg.trim(),time:'Just now'});
      this.newMsg='';
      this.typing=true;
      setTimeout(()=>{
        this.typing=false;
        const replies=['Got it, I\'ll get on that right away!','Perfect, will do!','Thanks for the update!','Sure, let me check and get back to you.'];
        this.messages[this.activeThread].push({mine:false,text:replies[Math.floor(Math.random()*replies.length)],time:'Just now'});
      },1800);
    }
  }
}
</script>
</body>
</html>
